name: Deploy static frontend to GitHub Pages

on:
  push:
    branches: [ main ]

# Required permissions for the Pages deploy action
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload frontend folder as pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
