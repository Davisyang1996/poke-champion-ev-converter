<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Davo's PokePaste Converter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Davo's PokePaste Converter</h1>
    <p class="summary">Simple tool that converts Stat Point (SP) to Effort Value (EV), i.e. Pokemon Champion to mainline EV</p>
    <div class="panel">
      <div class="left">
        <label for="url">Pokepaste URL or raw text</label>
        <textarea id="input" placeholder="Paste raw poke-paste text here (URLs are not supported on the public site)"></textarea>
        <p class="helper">Please paste raw poke-paste text into the box above — do not paste URLs. URL fetching is disabled on the public site for privacy and reliability.</p>
        <div class="controls">
          <button id="convert">Convert</button>
          <button id="clear">Clear</button>
        </div>
      </div>
      <div class="right">
        <div class="right-header" style="display:flex;align-items:center;justify-content:space-between;">
          <label style="margin:0">Converted output</label>
          <div>
            <button id="copyAll" title="Copy all converted text" style="margin-left:8px;background:#3a3f44;border:none;color:#fff;padding:6px 8px;border-radius:4px;cursor:pointer">Copy All</button>
          </div>
        </div>
        <pre id="output"></pre>
      </div>
    </div>
    <div style="height:12px"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
